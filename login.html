<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECTORGYM — Iniciar Sesión</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e53935">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HectorGym">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <!-- /PWA -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        html, body { height: auto !important; overflow-x: hidden !important; }
        .login-body {
            display: block !important;
            overflow: visible !important;
            height: auto !important;
            min-height: 100vh;
            /* fondo decorativo sin div que bloquee touch */
            background:
                radial-gradient(ellipse at 50% -10%, rgba(229,57,53,0.12) 0%, transparent 60%),
                repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(229,57,53,0.03) 40px, rgba(229,57,53,0.03) 41px),
                #080808 !important;
        }
        .login-wrapper {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            gap: 28px !important;
            max-width: 440px !important;
            width: 100% !important;
            margin: 0 auto !important;
            padding: 40px 24px !important;
            position: relative !important;
            z-index: 1 !important;
        }
    /* ── Splash login ────────────────────────── */
    #loginSplash {
        position: fixed; inset: 0; z-index: 9999;
        background: #000;
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 16px;
        transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loginSplash.out { opacity: 0; visibility: hidden; }
    .lspl-logo {
        width: 70px; height: 70px;
        background: linear-gradient(135deg, #c62828, #e53935);
        border-radius: 20px;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; color: #fff;
        box-shadow: 0 0 40px rgba(229,57,53,0.4);
        animation: lsplPulse 1s ease-in-out infinite alternate;
    }
    @keyframes lsplPulse {
        from { box-shadow: 0 0 20px rgba(229,57,53,0.3); transform: scale(1); }
        to   { box-shadow: 0 0 60px rgba(229,57,53,0.6); transform: scale(1.04); }
    }
    .lspl-title {
        font-family: 'Bebas Neue', 'Arial Black', sans-serif;
        font-size: 2.4rem; letter-spacing: 6px; color: #fff;
    }
    .lspl-title span { color: #e53935; }
    .lspl-bar {
        width: 160px; height: 2px;
        background: rgba(255,255,255,0.1); border-radius: 1px; overflow: hidden;
    }
    .lspl-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #c62828, #e53935);
        animation: lsplLoad 1.6s ease-in-out forwards;
        width: 0;
    }
    @keyframes lsplLoad { 0%{width:0} 70%{width:85%} 100%{width:100%} }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
</head>
<body data-page="login" class="login-body">

    <div id="loginSplash">
        <div class="lspl-logo"><i class="fas fa-dumbbell"></i></div>
        <div class="lspl-title">HECTOR<span>GYM</span></div>
        <div class="lspl-bar"><div class="lspl-bar-fill"></div></div>
    </div>

    <div class="login-wrapper">

        <!-- Logo / Branding -->
        <div class="login-brand">
            <div class="login-logo">
                <i class="fas fa-dumbbell"></i>
            </div>
            <h1 class="login-title">HECTOR<span class="login-title-accent">GYM</span></h1>
            <p class="login-subtitle">Panel de gestión y portal de clientes</p>
        </div>

        <!-- Tarjeta de login -->
        <div class="login-card">
            <div class="login-card-header">
                <i class="fas fa-right-to-bracket"></i>
                <span>Acceder al sistema</span>
            </div>

            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="login-field">
                    <label for="loginCorreo"><i class="fas fa-envelope"></i> Correo electrónico</label>
                    <input
                        type="email"
                        id="loginCorreo"
                        name="correo"
                        class="form-control"
                        placeholder="tu@correo.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <div class="login-field">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="login-password-wrap">
                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            class="form-control"
                            placeholder="••••••••"
                            required
                            autocomplete="current-password"
                        >
                        <button type="button" class="login-toggle-pass" id="togglePass" aria-label="Mostrar/Ocultar">
                            <i class="fas fa-eye" id="togglePassIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="status-message" id="loginStatus" style="display:none"></div>

                <button type="submit" class="btn btn-red login-btn" id="loginBtn">
                    <i class="fas fa-unlock"></i> INGRESAR
                </button>
            </form>

            <div class="login-card-footer">
                <i class="fas fa-shield-halved"></i>
                Los administradores acceden al panel de gestión.<br>
                Los clientes acceden a la página del gimnasio.
            </div>

            <!-- Toggle a registro -->
            <div class="login-toggle-mode">
                ¿No tienes cuenta?
                <button type="button" class="login-link-btn" id="showRegisterBtn">Crear cuenta</button>
            </div>
        </div>

        <!-- ===== TARJETA REGISTRO ===== -->
        <div class="login-card" id="registerCard" style="display:none">
            <div class="login-card-header">
                <i class="fas fa-user-plus"></i>
                <span>Crear cuenta</span>
            </div>

            <form id="registerForm" class="login-form" autocomplete="off">
                <div class="form-row-login">
                    <div class="login-field">
                        <label for="regNombre"><i class="fas fa-user"></i> Nombre</label>
                        <input type="text" id="regNombre" name="nombre" class="form-control"
                            placeholder="Tu nombre" required autocomplete="given-name">
                    </div>
                    <div class="login-field">
                        <label for="regApellido"><i class="fas fa-user"></i> Apellido</label>
                        <input type="text" id="regApellido" name="apellido" class="form-control"
                            placeholder="Tu apellido" required autocomplete="family-name">
                    </div>
                </div>

                <div class="login-field">
                    <label for="regDocumento"><i class="fas fa-id-card"></i> Documento <span style="color:var(--text-muted);font-size:0.75rem">(cédula)</span></label>
                    <input type="text" id="regDocumento" name="documento" class="form-control"
                        placeholder="Número de documento" autocomplete="off">
                </div>

                <div class="login-field">
                    <label for="regCorreo"><i class="fas fa-envelope"></i> Correo electrónico</label>
                    <input type="email" id="regCorreo" name="correo" class="form-control"
                        placeholder="tu@correo.com" required autocomplete="email">
                </div>

                <div class="login-field">
                    <label for="regTelefono"><i class="fas fa-phone"></i> Teléfono <span style="color:var(--text-muted);font-size:0.75rem">(opcional)</span></label>
                    <input type="tel" id="regTelefono" name="telefono" class="form-control"
                        placeholder="300 123 4567">
                </div>

                <div class="login-field">
                    <label for="regPassword"><i class="fas fa-lock"></i> Contraseña</label>
                    <div class="login-password-wrap">
                        <input type="password" id="regPassword" name="password" class="form-control"
                            placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
                        <button type="button" class="login-toggle-pass" id="toggleRegPass" aria-label="Mostrar/Ocultar">
                            <i class="fas fa-eye" id="toggleRegPassIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="status-message" id="registerStatus" style="display:none"></div>

                <button type="submit" class="btn btn-red login-btn" id="registerBtn">
                    <i class="fas fa-user-plus"></i> REGISTRARME
                </button>
            </form>

            <div class="login-toggle-mode">
                ¿Ya tienes cuenta?
                <button type="button" class="login-link-btn" id="showLoginBtn">Iniciar sesión</button>
            </div>
        </div>

        <!-- Link a la landing pública -->
        <a href="landing.html" class="login-public-link">
            <i class="fas fa-store"></i> Ver página del gimnasio sin iniciar sesión
        </a>

    </div>

    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
        // Splash screen
        (function() {
            var s = document.getElementById('loginSplash');
            if (!s) return;
            document.body.style.overflow = 'hidden';
            setTimeout(function() {
                s.classList.add('out');
                document.body.style.overflow = '';
                setTimeout(function() { s.remove(); }, 550);
            }, 1800);
        })();
    </script>

</body>
</html>
