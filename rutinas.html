<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HECTORGYM - Rutinas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body data-page="rutinas">

    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">
            <i class="fas fa-dumbbell icon"></i>
            <span>HECTOR<span class="gym">GYM</span></span>
        </a>
        <ul class="navbar-nav">
            <li><a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a></li>
            <li><a href="clientes.html"><i class="fas fa-users"></i> Clientes</a></li>
            <li><a href="membresias.html"><i class="fas fa-id-card"></i> Membresías</a></li>
            <li><a href="pagos.html"><i class="fas fa-money-bill-wave"></i> Pagos</a></li>
            <li><a href="rutinas.html" class="active"><i class="fas fa-clipboard-list"></i> Rutinas</a></li>
            <li><a href="maquinas.html"><i class="fas fa-cog"></i> Máquinas</a></li>
        </ul>
        <button class="btn btn-logout" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> Salir
        </button>
    </nav>

    <!-- Main Content -->
    <div class="main-container">

        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="fas fa-clipboard-list"></i> Rutinas de Entrenamiento</h1>
            <button class="btn btn-orange" onclick="document.getElementById('modalRutina').classList.add('active')">
                <i class="fas fa-plus"></i> Nueva Rutina
            </button>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="rutinasSearch" placeholder="Buscar rutina por nombre o cliente...">
            </div>
            <select class="filter-select" id="rutinasObjetivoFilter">
                <option value="todos">Todos los objetivos</option>
                <option value="Ganancia de masa">Ganancia de masa</option>
                <option value="Pérdida de peso">Pérdida de peso</option>
                <option value="Tonificación">Tonificación</option>
                <option value="Resistencia">Resistencia</option>
            </select>
        </div>

        <div id="rutinasContainer">
            <div class="empty-state">
                <i class="fas fa-clipboard-list"></i>
                <p>Cargando rutinas...</p>
            </div>
        </div>

    </div>

    <!-- Modal: Nueva Rutina -->
    <div class="modal-overlay" id="modalRutina">
        <div class="modal">
            <div class="modal-header">
                <span><i class="fas fa-clipboard-list"></i> Nueva Rutina</span>
                <button class="modal-close" onclick="this.closest('.modal-overlay').classList.remove('active')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="rutinaForm">
                <div class="form-group">
                    <label>Nombre de la Rutina</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Rutina Hipertrofia" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Objetivo</label>
                        <select name="objetivo" class="form-control">
                            <option>Ganancia de masa</option>
                            <option>Pérdida de peso</option>
                            <option>Tonificación</option>
                            <option>Resistencia</option>
                            <option>Flexibilidad</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nivel</label>
                        <select name="nivel" class="form-control">
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Asignar a Cliente</label>
                    <select name="usuario_id" class="form-control" id="rutinaUsuarioSelect">
                        <option value="">No asignar todavía</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Describe la rutina..."></textarea>
                </div>

                <h4 style="margin: 20px 0 12px; color: var(--orange)"><i class="fas fa-list"></i> Ejercicio principal</h4>
                <div style="background: var(--bg-primary); padding: 16px; margin-bottom: 12px">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Ejercicio</label>
                            <select name="ejercicio_id" class="form-control" id="rutinaEjercicioSelect">
                                <option value="">Sin ejercicios por ahora</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Series</label>
                            <input type="number" name="series" class="form-control" placeholder="4" value="3">
                        </div>
                    </div>
                    <div class="form-row" style="grid-template-columns: 1fr 1fr">
                        <div class="form-group">
                            <label>Repeticiones</label>
                            <input type="text" name="repeticiones" class="form-control" placeholder="10" value="10">
                        </div>
                        <div class="form-group">
                            <label>Descanso</label>
                            <input type="number" name="descanso_seg" class="form-control" placeholder="60" value="60">
                        </div>
                    </div>
                </div>

                <div class="status-message status-info" id="rutinaFormStatus">Puedes crear una rutina básica y asignarla a un cliente.</div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('modalRutina').classList.remove('active')">Cancelar</button>
                    <button type="submit" class="btn btn-orange"><i class="fas fa-save"></i> Guardar Rutina</button>
                </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer Nav -->
    <nav class="admin-footer">
        <a href="index.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a href="clientes.html"><i class="fas fa-users"></i> Clientes</a>
        <a href="membresias.html"><i class="fas fa-id-card"></i> Membresías</a>
        <a href="pagos.html"><i class="fas fa-money-bill-wave"></i> Pagos</a>
        <a href="rutinas.html" class="active"><i class="fas fa-clipboard-list"></i> Rutinas</a>
        <a href="maquinas.html"><i class="fas fa-cog"></i> Máquinas</a>
    </nav>

    <script src="js/app.js"></script>

</body>
</html>
